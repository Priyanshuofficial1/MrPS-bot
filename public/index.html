<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MrPS Assistant</title><style>*{box-sizing:border-box}body{margin:0;background:#07080d;color:#eee;font:15px system-ui}main{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between}.brand{font-size:30px;font-weight:800}.ok{color:#72ffad}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:24px}.card{background:#10121a;border:1px solid #242735;border-radius:18px;padding:20px}.cmd{display:flex;gap:10px}.cmd input{flex:1;background:#080a10;border:1px solid #303446;color:#fff;padding:14px;border-radius:12px}.cmd button{padding:0 22px;border:0;border-radius:12px;font-weight:700}.item{padding:10px 0;border-bottom:1px solid #242735}.out{white-space:pre-wrap;color:#aeb7ff;margin-top:15px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">MRPS<span style="opacity:.4">.bot</span></div><div class="ok">● ONLINE</div></div><div class="grid"><section class="card"><h1 id="greet">Good morning, Boss.</h1><p>Local-first personal PC assistant.</p><div class="cmd"><input id="q" placeholder="Hey MrPS... add task / system status / open VS Code"><button onclick="go()">RUN</button></div><div id="out" class="out"></div></section><section class="card"><h2>Today's Tasks</h2><div id="tasks">Loading...</div></section><section class="card"><h2>Ideas</h2><div id="ideas">Loading...</div></section><section class="card"><h2>System</h2><div id="sys">Loading...</div></section></div></main><script>async function api(p,o){return(await fetch(p,o)).json()}async function load(){let b=await api('/api/briefing'),h=await api('/api/health');greet.textContent=b.greeting;tasks.innerHTML=b.tasks.length?b.tasks.map(x=>'<div class="item">'+x.title+'</div>').join(''):'<div class="item">No pending tasks</div>';ideas.innerHTML=b.ideas.length?b.ideas.map(x=>'<div class="item">'+x.text+'</div>').join(''):'<div class="item">No ideas yet</div>';sys.innerHTML='<div class="item">OpenBot adapter: '+(h.openbot.available?'connected':'ready')+'</div>'}async function go(){let t=q.value;if(!t)return;out.textContent='Working...';let r=await api('/api/command',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:t})});out.textContent=JSON.stringify(r.result,null,2);q.value='';load()}q.addEventListener('keydown',e=>e.key==='Enter'&&go());load()</script></body></html>
